  for (const sx of [-1, 1]) box(0.42, 0.42, 0.06, win, sx * 0.75, 1.15, 1.16, g);
  scene.add(g); houses.push({ g, win, z });
}

// ---------- auto-rickshaw ----------
const auto = new THREE.Group();
{ box(1.25, 0.7, 2.1, M(0x1e8a3c, { roughness: 0.4 }), 0, 0.62, 0, auto); box(1.2, 0.75, 1.7, M(0xf2c318, { roughness: 0.4 }), 0, 1.33, -0.15, auto);
  box(1.0, 0.45, 0.05, new THREE.MeshStandardMaterial({ color: 0x0c1016, roughness: 0.1 }), 0, 1.3, 0.72, auto);
  for (const [x, z] of [[0, 0.95], [-0.6, -0.8], [0.6, -0.8]]) { const w = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.14, 16), M(0x0a0a0a)); w.rotation.z = Math.PI / 2; w.position.set(x, 0.24, z); auto.add(w); }
  const hl = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 8), new THREE.MeshStandardMaterial({ color: 0, emissive: 0xfff2c8, emissiveIntensity: 3 })); hl.position.set(0, 0.85, 1.08); auto.add(hl);
  const sp = new THREE.SpotLight(0xfff0c4, 40, 30, 0.45, 0.6, 1.4); sp.position.set(0, 0.9, 1.1); sp.target.position.set(0, 0, 14); auto.add(sp, sp.target);
  const tl = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), new THREE.MeshStandardMaterial({ color: 0, emissive: 0xff2020, emissiveIntensity: 5 })); tl.position.set(0.45, 0.8, -1.06); auto.add(tl);
  auto.traverse(m => { if (m.isMesh) m.castShadow = true; }); scene.add(auto); }

// ---------- rain ----------
const NR = 2600, rainPos = new Float32Array(NR * 6), rainSeed = Array.from({ length: NR }, () => [rnd(), rnd(), rnd(), 0.7 + rnd() * 0.6]);
const rainGeo = new THREE.BufferGeometry(); rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rain = new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({ color: 0xa9c4ff, transparent: true, opacity: 0.2, fog: false })); rain.frustumCulled = false; scene.add(rain);
function updateRain(t) {
  const c = camera.position;
  for (let i = 0; i < NR; i++) { const s = rainSeed[i];
    const x = c.x + (s[0] - 0.5) * 26, z = c.z - 2 - s[2] * 30, y = 14 - ((s[1] * 14 + t * 17 * s[3]) % 14);
    rainPos.set([x, y, z, x + 0.05, y - 0.55 * s[3], z], i * 6); }
  rainGeo.attributes.position.needsUpdate = true;
}

// ---------- post ----------
const composer = new EffectComposer(renderer); composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.32, 0.55, 0.9); composer.addPass(bloom);
composer.addPass(new OutputPass());
const out = document.createElement('canvas'); out.width = W; out.height = H; const ctx = out.getContext('2d');

// ---------- helpers for the timeline ----------
const shotAt = t => TL.shots.find(s => t >= s.t0 && t < s.t1) || TL.shots[TL.shots.length - 1];
const lineAt = (sh, t) => { let cur = null; for (const l of sh.lines) if (t >= l.t0 - 0.05) cur = l; return cur; };
const rmsAt = t => TL.rms[Math.min(TL.rms.length - 1, Math.max(0, Math.round(t * TL.fps)))] || 0;
const look = new THREE.Vector3();
function cam(px, py, pz, lx, ly, lz, fov = 42) { camera.position.set(px, py, pz); look.set(lx, ly, lz); camera.fov = fov; }

function animate(t) {
  const sh = shotAt(t), u = (t - sh.t0) / (sh.t1 - sh.t0), ts = t - sh.t0;
  const ln = lineAt(sh, t), speaking = ln && t >= ln.t0 && t <= ln.t1, r = rmsAt(t);
  const talkM = speaking && (ln.who === 'm' || ln.who === 'c') ? clamp(r * 9) : 0, talkK = speaking && (ln.who === 'k' || ln.who === 'c') ? clamp(r * 9) : 0;
  const hitT = sh.hit != null ? t - sh.hit : -1;
  // defaults
  n17.visible = n0.visible = n13.visible = false; glow17.intensity = glow0.intensity = barGlow.intensity = 0;
  bars.forEach(b => { b.m.visible = b.lab.visible = false; });
  auto.position.set(1.9, 0, -400);
  let pm = { look: 0.25, angry: 0.5 }, pk = { look: -0.3, sad: 0.3 };
  bloom.strength = 0.32;

  if (sh.name === 'open') {
    // crane down from above the street to the pothole; an auto swerves past; the number rises out of the hole
    const e = smooth(ts / 3.0);
    cam(lerp(2.6, 0.9, e), lerp(9.5, 0.85, e), lerp(26, 6.6, e), lerp(0, PH.x, e), lerp(2.5, 0.7 + smooth((ts - 2.0) / 1.5) * 0.75, e), lerp(-30, 0, e), 46);
    const az = lerp(-70, 40, clamp(ts / 3.4)); auto.position.set(1.9 + Math.exp(-Math.pow((az + 2) / 9, 2)) * 0.9, Math.abs(Math.sin(az * 2.2)) * 0.015, az); auto.rotation.y = -Math.sin((az + 2) / 9) * Math.exp(-Math.pow((az + 2) / 9, 2)) * 0.12;
    if (hitT >= 0) { const k = easeBack(hitT / 0.55); n17.visible = true; n17.position.set(PH.x, lerp(-1.6, 0.42, k), PH.z - 0.2); n17.rotation.y = lerp(0.9, 0.22, easeOut(hitT / 0.8)) + Math.sin(t * 0.8) * 0.04;
      glow17.position.set(PH.x, 1.2, PH.z + 1.2); glow17.intensity = 9 * clamp(hitT / 0.3); }
    pm = { look: 0.1, sad: 0.6, pitch: 0.2, talk: talkM }; pk = { look: -0.1, sad: 0.8, pitch: 0.25 };
  } else if (sh.name === 'bars') {
    cam(lerp(0.5, 0.0, smooth(u)), lerp(1.45, 1.6, smooth(u)), lerp(1.6, 2.6, smooth(u)), 0, lerp(3.3, 3.6, smooth(u)), -9.5, 55);
    bars.forEach((b, i) => { const k = easeOut((ts - 0.25 - (i < 2 ? i * 0.18 : 0.5 + (i - 2) * 0.12)) / 0.7); b.m.visible = true; b.m.scale.y = Math.max(0.001, b.h * k); b.m.position.y = b.h * k / 2;
      b.lab.visible = k > 0.05; b.lab.material.opacity = clamp(k * 2); b.lab.position.set(b.x, b.h * k + (i < 2 ? 1.0 : 3.3), b.z); b.lab.scale.set(i < 2 ? 2.3 : 2.0, i < 2 ? 1.72 : 1.5, 1); });
    barGlow.intensity = 14 * easeOut((ts - 0.3) / 0.8);
    pm = { look: -0.35, angry: 0.7, eyeX: -1 }; pk = { look: 0.25, talk: talkK, gesture: speaking ? 1 : 0.2, sad: 0.2 };
  } else if (sh.name === 'court') {
    // close on Kaveri, Mallanna listening
    cam(lerp(2.3, 1.9, smooth(u)), 1.22, lerp(-2.2, -2.5, smooth(u)), 0.55, 1.2, -4.4, 30);
    bars.forEach((b, i) => { b.m.visible = true; b.m.scale.y = b.h; b.m.position.y = b.h / 2; });
    barGlow.intensity = 10;
    pm = { look: 0.75, angry: 0.6, eyeX: 1 }; pk = { look: 0.35, talk: talkK, gesture: speaking ? 0.8 : 0.1 };
  } else if (sh.name === 'houses') {
    const cut = sh.hit - sh.t0 + 1.5;
    if (ts < cut) { // glide past thirteen dark houses, then the zero lands
      const e = smooth(ts / (cut + 0.4));
      cam(lerp(1.5, 2.6, e), lerp(1.7, 4.6, e), lerp(-24, -29, e), lerp(-6.6, -5.2, e), lerp(1.3, 1.6, e), lerp(-34, -50, e), 52);
      if (hitT >= 0) { const k = easeBack(hitT / 0.5);
        n0.visible = n13.visible = true; n0.position.set(-2.2, lerp(9, 0.05, k), -44); n13.position.set(1.0, lerp(9, 0.05, easeBack((hitT - 0.12) / 0.5)), -44);
        n0.rotation.y = n13.rotation.y = 0.32; glow0.position.set(-1.5, 2.5, -40); glow0.intensity = 22 * clamp(hitT / 0.25); }
    } else { // back to Mallanna, angry
      const v = smooth((ts - cut) / (sh.t1 - sh.t0 - cut));
      cam(lerp(-2.6, -2.3, v), 1.5, lerp(-1.6, -1.9, v), -0.85, 1.52, -4.5, 26);
      bars.forEach(b => { b.m.visible = true; b.m.scale.y = b.h; b.m.position.y = b.h / 2; }); barGlow.intensity = 10;
    }
    pm = { look: -0.5, angry: 1, talk: talkM, gesture: speaking ? 1 : 0.3 }; pk = { look: -0.6, sad: 0.7 };
  } else { // chorus: low hero angle, arms up on the beat, camera rises and pulls back
    const e = smooth(u);
    cam(lerp(0.3, 0, e), lerp(0.7, 1.6, e), lerp(-1.4, 1.6, e), 0, lerp(1.45, 1.75, e), -4.4, 44);
    const beat = Math.pow(Math.abs(Math.sin(t * Math.PI * TL.bpm / 60)), 3);
    pm = { look: -0.12, angry: 0.8, talk: talkM, raise: 0.72 + beat * 0.22 }; pk = { look: 0.14, talk: talkK, raise: 0.68 + beat * 0.24 };
    lampBulbs.forEach(b => b.material.emissiveIntensity = 3 + beat * 2.5); bloom.strength = 0.36 + beat * 0.16;
    bars.forEach(b => { b.m.visible = true; b.m.scale.y = b.h; b.m.position.y = b.h / 2; }); barGlow.intensity = 10;
  }

  mal.pose(t, pm); kav.pose(t, pk);
  // hit: shake + bloom kick
  let shake = 0; for (const h of TL.hits) if (t >= h && t - h < 0.4) shake = 1 - (t - h) / 0.4;
  camera.position.x += Math.sin(t * 91) * 0.05 * shake; camera.position.y += Math.cos(t * 77) * 0.04 * shake; bloom.strength += shake * 0.25;
  // gentle handheld drift
  camera.position.x += Math.sin(t * 0.7) * 0.015; camera.position.y += Math.sin(t * 0.9 + 1) * 0.01;
  camera.lookAt(look); camera.updateProjectionMatrix();
  moon.target.position.set(camera.position.x, 0, camera.position.z - 10); moon.position.set(camera.position.x - 14, 22, camera.position.z);
  updateRain(t);
  return { sh, ln, speaking, shake, hitT, ts };
}

// ---------- 2D overlay: brand, kicker, word-by-word captions, source ----------
const KN = '"Kannada Sangam MN","Kannada MN","Noto Sans Kannada",sans-serif', LAT = '"Helvetica Neue",Arial,sans-serif';
function wrap(words, font, maxW) { ctx.font = font; const lines = [[]]; let w = 0; const sp = ctx.measureText(' ').width;
  words.forEach((wd, i) => { const ww = ctx.measureText(wd).width; if (w + ww > maxW && lines[lines.length - 1].length) { lines.push([]); w = 0; } lines[lines.length - 1].push({ wd, ww, i }); w += ww + sp; });
  return { lines, sp }; }
function overlay(t, st) {
  const { sh, ln } = st;
  let g = ctx.createLinearGradient(0, 0, 0, 420); g.addColorStop(0, 'rgba(4,6,14,.82)'); g.addColorStop(1, 'rgba(4,6,14,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, 420);
  g = ctx.createLinearGradient(0, 1180, 0, H); g.addColorStop(0, 'rgba(4,6,14,0)'); g.addColorStop(0.45, 'rgba(4,6,14,.72)'); g.addColorStop(1, 'rgba(4,6,14,.9)'); ctx.fillStyle = g; ctx.fillRect(0, 1180, W, H - 1180);
  ctx.fillStyle = '#f2b705'; ctx.fillRect(0, 0, W / 2, 12); ctx.fillStyle = '#c21f30'; ctx.fillRect(W / 2, 0, W / 2, 12);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 12;
  ctx.font = '600 34px ' + LAT + ',' + KN; ctx.fillStyle = '#c4cad6'; ctx.fillText('Gandaberunda · ಗಂಡಭೇರುಂಡ', 70, 110);
  const ka = clamp(st.ts / 0.35); ctx.globalAlpha = ka; ctx.font = '800 50px ' + KN; ctx.fillStyle = '#f2b705'; ctx.fillText(sh.kicker, 70 - (1 - easeOut(ka)) * 40, 190); ctx.globalAlpha = 1;
  if (sh.name === 'court') { const a = clamp((st.ts - 0.3) / 0.4); ctx.globalAlpha = a; ctx.font = '800 54px ' + KN; ctx.fillStyle = '#fff';
    ['“ಗುಂಡಿ ಇಲ್ಲದ ರಸ್ತೆ ಬಿಬಿಎಂಪಿಯ', 'ಕಾನೂನು ಮತ್ತು ಸಾಂವಿಧಾನಿಕ ಹೊಣೆ.”'].forEach((s, i) => ctx.fillText(s, 70, 290 + i * 74)); ctx.globalAlpha = 1; }
  if (sh.name === 'houses' && st.ts < sh.hit - sh.t0 + 1.5) { const n = Math.min(13, Math.floor(st.ts / (sh.hit - sh.t0) * 13) + 1);
    ctx.font = '800 60px ' + KN; ctx.fillStyle = '#fff'; ctx.fillText('ಜೀವ ಕಳೆದುಕೊಂಡ ಕುಟುಂಬಗಳು: ' + n, 70, 290);
    if (st.hitT >= 0) { ctx.globalAlpha = clamp(st.hitT / 0.3); ctx.fillStyle = '#ff4d60'; ctx.fillText('ಪರಿಹಾರ ಸಿಕ್ಕವರು: 0', 70, 370); ctx.globalAlpha = 1; } }
  if (sh.name === 'open' && st.hitT >= 0.2) { ctx.globalAlpha = clamp((st.hitT - 0.2) / 0.3); ctx.font = '800 56px ' + KN; ctx.fillStyle = '#fff';
    ['ನಗರ ಸಂಸ್ಥೆಗಳ ನಿರ್ಲಕ್ಷ್ಯದಿಂದ', '17 ಸಾವು'].forEach((s, i) => ctx.fillText(s, 70, 290 + i * 74)); ctx.globalAlpha = 1; }
  // captions
  if (ln && t >= ln.t0 - 0.05) {
    const chorus = ln.who === 'c', words = ln.kn.split(' ').filter(Boolean);
    const fs = chorus ? 82 : 68, font = '900 ' + fs + 'px ' + KN, { lines, sp } = wrap(words, font, 940);
    const wt = []; let acc = 0; words.forEach(w => { acc += w.length + 1.5; wt.push(acc); }); const uu = (t - ln.t0) / (ln.t1 - ln.t0);
    let wi = wt.findIndex(x => x / acc > uu); if (uu >= 1) wi = words.length; if (wi < 0) wi = words.length;
    const lh = fs * 1.32, y0 = (chorus ? 1380 : 1430) - (lines.length - 1) * lh / 2; ctx.textAlign = 'left'; ctx.lineJoin = 'round';
    lines.forEach((L, li) => { const tw = L.reduce((a, b) => a + b.ww, 0) + sp * (L.length - 1); let x = (W - tw) / 2; const y = y0 + li * lh;
      for (const o of L) { ctx.font = font; const cur = o.i === wi, done = o.i < wi;
        if (cur) { ctx.shadowBlur = 0; ctx.fillStyle = '#f2b705'; const p = 12; ctx.beginPath(); ctx.roundRect(x - p, y - fs * 0.92, o.ww + p * 2, fs * 1.28, 16); ctx.fill(); ctx.fillStyle = '#11141a'; ctx.fillText(o.wd, x, y); }
        else { ctx.shadowColor = 'rgba(0,0,0,.95)'; ctx.shadowBlur = 14; ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.globalAlpha = done ? 1 : 0.55; ctx.strokeText(o.wd, x, y); ctx.fillStyle = chorus && done ? '#f2b705' : '#ffffff'; ctx.fillText(o.wd, x, y); ctx.globalAlpha = 1; }
        x += o.ww + sp; } });
    ctx.shadowBlur = 10; ctx.textAlign = 'center'; ctx.font = '500 36px ' + LAT; ctx.fillStyle = '#d5dae4'; ctx.fillText(ln.en, W / 2, y0 + lines.length * lh + 6);
  }
  if (sh.name === 'chorus') { ctx.textAlign = 'center'; ctx.font = '800 44px ' + LAT; ctx.fillStyle = '#f2b705'; ctx.globalAlpha = clamp((st.ts - 3) / 0.5); ctx.fillText('jarvisss007.github.io/know-your-mla', W / 2, 300); ctx.globalAlpha = 1; }
  ctx.textAlign = 'left'; ctx.shadowBlur = 6; ctx.font = '400 25px ' + LAT; ctx.fillStyle = '#9aa3b2'; ctx.fillText(sh.src, 70, 1790);
  if (st.shake > 0.6) { ctx.fillStyle = 'rgba(255,255,255,' + ((st.shake - 0.6) * 0.5) + ')'; ctx.fillRect(0, 0, W, H); }
  ctx.shadowBlur = 0;
}

// ---------- render loop ----------
await document.fonts.ready;
const t0 = performance.now();
for (let f = 0; f < TL.frames; f += EVERY) {
  const t = f / TL.fps, st = animate(t);
  composer.render();
  ctx.drawImage(renderer.domElement, 0, 0); overlay(t, st);
  const blob = await new Promise(z => out.toBlob(z, 'image/jpeg', 0.94));
  await fetch('/frame', { method: 'POST', body: blob });
}
await log('rendered ' + Math.ceil(TL.frames / EVERY) + ' frames in ' + Math.round((performance.now() - t0) / 1000) + 's');
await fetch('/done', { method: 'POST' });
